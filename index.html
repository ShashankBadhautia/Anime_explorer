<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>
<body>
  <div class="header">
    <h1>Anime Explorer</h1>
  </div>
  <div class="main">
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search for anime...">
      <button id="search-button">Search</button>
      <button id="reset-button">Trending</button>
      <button id="advanced-button">Advanced</button>
        <div id="filters-container" style="display: none;">
          <label><input type="checkbox" value="tv"> TV</label>
          <label><input type="checkbox" value="movie"> Movie</label>
          <label><input type="checkbox" value="ova"> OVA</label>
          <label><input type="checkbox" value="special"> Special</label>
        </div>
    </div>
    <div id="results-container">
      
    </div>
  </div>

</body>
</html>

<script src="script.js"></script>
